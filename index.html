<script>
'use strict';
const KEY='nailprofit_v2',OLD='nailprofit_v1';
const clone=x=>JSON.parse(JSON.stringify(x)),num=x=>Math.max(0,Number(x)||0),signed=x=>Number(x)||0,krw=x=>Math.round(x).toLocaleString('ko-KR')+'원';
const fmt=x=>Math.round(x).toLocaleString('ko-KR');
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>String(Date.now())+'_'+Math.random().toString(36).slice(2,8);
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthOf=d=>String(d||'').slice(0,7);
const cleanDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d);

const MAT_TREE={
  '젤류':['베이스젤','클리어젤','탑젤','솔리드젤','시럽젤','자석젤','글리터젤','기타'],
  '아트':['파츠','스톤','진주','스티커','체인','파우더','글리터','필름','기타'],
  '소모품':['전체']
};
function inferFolder(n){const t=String(n||'');if(/파일|버퍼|와이프|클렌저|리무버|솜|비트|니퍼|장갑|마스크/.test(t))return ['소모품','전체'];if(/파츠|스와|큐빅|스톤/.test(t))return ['아트','스톤'];if(/진주/.test(t))return ['아트','진주'];if(/스티커/.test(t))return ['아트','스티커'];if(/베이스/.test(t))return ['젤류','베이스젤'];if(/클리어/.test(t))return ['젤류','클리어젤'];if(/탑/.test(t))return ['젤류','탑젤'];if(/시럽/.test(t))return ['젤류','시럽젤'];if(/자석/.test(t))return ['젤류','자석젤'];if(/글리터젤/.test(t))return ['젤류','글리터젤'];return ['젤류','솔리드젤']}
function fixMaterial(m){let [maj,min]=inferFolder(m.name);if(!MAT_TREE[m.major])m.major=maj;if(!MAT_TREE[m.major].includes(m.minor))m.minor=m.major===maj?min:MAT_TREE[m.major][0];m.mode=m.mode==='each'?'each':'customer';m.packQty=Math.max(1,num(m.packQty)||1);m.clients=Math.max(1,num(m.clients)||1);m.price=num(m.price);return m}
function unitLabel(m){return m.mode==='each'?'개/알':'회'}
function matPath(m){return (m.major||'미분류')+(m.major==='소모품'?'':' / '+(m.minor||'기타'))}
let matMajor='젤류',matMinor='베이스젤',materialSearch='';
let pickerMajor='all',pickerMinor='all',pickerSearch='';
function formatMatOption(m){return matPath(m)+' · '+m.name+' (1'+unitLabel(m)+' '+krw(unitMat(m))+')'}
function pickedMaterials(){return state.materials.filter(m=>(pickerMajor==='all'||m.major===pickerMajor)&&(pickerMinor==='all'||m.minor===pickerMinor)&&(!pickerSearch||((m.name+' '+matPath(m)).toLowerCase().includes(pickerSearch.toLowerCase()))))}
function optionsForPicker(){const matches=pickedMaterials();return matches.map(m=>`<option value="${h(m.id)}">${h(formatMatOption(m))}</option>`).join('')}
function changePickerMajor(v){pickerMajor=v;pickerMinor='all';pickerSearch='';render()}
function changePickerMinor(v){pickerMinor=v;pickerSearch='';render()}
function filterPicker(q){pickerSearch=q;let select=document.getElementById('materialPicker');if(select)select.innerHTML=optionsForPicker()}
function addUsedMaterial(){ensureDraft();const selector=document.getElementById('materialPicker'),qtyBox=document.getElementById('materialPickQty');let id=selector?.value,qty=num(qtyBox?.value);if(!id||!state.materials.some(m=>String(m.id)===String(id))){alert('먼저 재료를 선택해 주세요. 재료가 없다면 [재료별 원가]에서 등록할 수 있습니다.');return}if(qty<=0){alert('사용 수량은 0보다 커야 합니다.');return}draft.usage??=[];let found=draft.usage.find(x=>String(x.id)===String(id));if(found)found.qty=num(found.qty)+qty;else draft.usage.push({id,qty});render()}

function migrate(v){let f=fresh();f.materials=(v.materials||[]).map(m=>({id:String(m.id),name:m.name,price:num(m.price),clients:num(m.clients)||1}));f.services=(v.services||[]).map(s=>({id:String(s.id),name:s.name,price:num(s.price),mins:num(s.mins)||60,materials:(s.matIds||[]).map(id=>({id:String(id),units:num((v.materials||[]).find(m=>String(m.id)===String(id))?.qty)||1})),extra:num(s.extraCost)}));f.fixed=(v.fixed||[]).map(x=>({id:String(x.id),name:x.name,amount:num(x.amount)}));const rates=(v.services||[]).map(x=>num(x.commission));if(rates.length){f.staff.push({id:'a1',name:'디자이너 (설정 필요)',rate:rates[0],deduct:0,deductOn:'commission',base:'gross',guarantee:0,withhold:3.3})}if(v.costs){f.settings.cardRate=num(v.costs.cardRate);f.settings.monthlyExtraPayroll=num(v.costs.otherPayroll);f.settings.monthlyOtherVariable=num(v.costs.otherVariable)}if(v.settings?.taxType)f.settings.taxType=v.settings.taxType;return f}

function calcDraft(d){let items=d.lines.map(l=>{let s=state.services.find(v=>String(v.id)===String(l.serviceId));let qty=num(l.qty),unitPrice=num(l.price);return {serviceId:String(l.serviceId),name:s?.name||'삭제된 시술',qty,unitPrice,gross:qty*unitPrice,material:qty*(s?recipeCost(s):0),mins:qty*num(s?.mins)}});let recipeMaterial=items.reduce((a,x)=>a+x.material,0);let usageItems=(d.usage||[]).map(u=>{let m=state.materials.find(x=>String(x.id)===String(u.id)),qty=num(u.qty),unitPrice=m?unitMat(m):0;return {id:String(u.id),name:m?.name||'삭제된 재료',folder:m?matPath(m):'',qty,unitPrice,unit:m?unitLabel(m):'회',cost:qty*unitPrice}});let useMaterial=usageItems.reduce((a,x)=>a+x.cost,0),manualMaterial=num(d.extraMaterial),sale=Math.max(0,items.reduce((a,x)=>a+x.gross,0)-num(d.discount)+num(d.extraCharge)),material=recipeMaterial+useMaterial+manualMaterial;let artist=state.staff.find(x=>String(x.id)===String(d.staffId))||state.staff[0];let base=artist.base==='net'?sale/1.1:sale;let commission=base*num(artist.rate)/100;let deduction=(artist.deductOn==='sales'?base:commission)*num(artist.deduct)/100;let payroll=Math.max(0,commission-deduction);let deposit=num(d.depositAmount??0),depositTooHigh=deposit>sale,balance=Math.max(0,sale-deposit),balancePayment=d.balancePayment||d.payment||'card';let depositFee=deposit*num(state.settings.naverRate)/100,balanceFee=balance*(balancePayment==='card'?num(state.settings.cardRate):balancePayment==='naver'?num(state.settings.naverRate):0)/100;let processing=depositFee+balanceFee;return {items,usageItems,recipeMaterial,useMaterial,manualMaterial,sale,material,payroll,processing,deposit,depositDate:d.depositDate||'',balance,balancePayment,depositFee,balanceFee,depositTooHigh,mins:items.reduce((a,x)=>a+x.mins,0),staffId:d.staffId,payment:balancePayment,contribution:sale-material-payroll-processing,base,artistName:artist.name}}
function entry(){ensureDraft();let p=calcDraft(draft);let opts=state.services.map(s=>`<option value="${h(s.id)}">${h(s.name)}</option>`).join('');return `<div class="flex2"><section class="panel"><div class="row between"><h2>${editing?'시술 기록 수정':'고객 1명 시술 완료 기록'}</h2><span class="pill">저장 즉시 월 손익 반영</span></div><p class="subtitle">시술 메뉴와 사용 재료를 선택하면 기본 재료비·아트 재료비·아티스트 정산액을 자동 계산합니다. 고객 이름은 선택 사항입니다.</p><div class="warn" style="margin-bottom:14px">처음 사용한다면 <b>재료별 원가 · 시술 메뉴 · 직원 정산 · 월 고정비</b>를 실제 샵 기준으로 먼저 설정해 주세요. 기본 재료 가격과 메뉴 가격은 입력 예시이며 실제 시술 원가가 아닙니다.</div><div class="fields"><div class="field"><label>시술일</label><input type="date" value="${h(draft.date)}" onchange="setD('date',this.value)"></div><div class="field"><label>시술 담당자</label><select onchange="setD('staffId',this.value,true)">${state.staff.map(a=>`<option value="${h(a.id)}" ${String(a.id)===String(draft.staffId)?'selected':''}>${h(a.name)}</option>`).join('')}</select></div><div class="field"><label>고객 메모명 (선택)</label><input type="text" maxlength="50" placeholder="예: 11월 15일 오후 고객" value="${h(draft.customer)}" oninput="setD('customer',this.value)"></div></div><h3>결제 내역 · 예약금과 잔여금 분리</h3><div class="good" style="margin-bottom:12px">예약금은 <b>N페이</b>로 받는 것으로 계산하고, 남은 금액만 아래에서 결제수단을 선택하세요. 예약금이 없는 고객은 0원을 입력하세요.</div><div class="fields"><div class="field"><label>① N페이 예약금 (원)</label><input type="number" min="0" step="100" value="${h(draft.depositAmount??0)}" oninput="setD('depositAmount',this.value*1)"></div><div class="field"><label>예약금 수납일 (선택)</label><input type="date" value="${h(draft.depositDate||'')}" onchange="setD('depositDate',this.value)"></div><div class="field"><label>② 잔여금 결제 방식</label><select onchange="setD('balancePayment',this.value,true)">${[['naver','N페이'],['card','카드'],['cash','현금'],['transfer','계좌이체']].map(([a,b])=>`<option value="${a}" ${(draft.balancePayment||draft.payment||'card')===a?'selected':''}>${b}</option>`).join('')}</select></div></div><p class="hint">총 시술금액 = 예약금 + 잔여금입니다. 수수료는 N페이 예약금과 잔여금의 결제수단에 각각 적용됩니다. 예약금이 이전 달에 수납되었어도 시술매출은 시술일 기준으로 한 번만 집계하며, 이 화면은 월별 현금 입금액을 계산하지 않습니다.</p><div class="fields"></div><h3>시술 내역</h3>${draft.lines.map((l,i)=>`<div class="lineItem"><div class="line-grid"><div class="field"><label>시술 메뉴</label><select onchange="chooseService(${i},this.value)">${state.services.map(s=>`<option value="${h(s.id)}" ${String(l.serviceId)===String(s.id)?'selected':''}>${h(s.name)}</option>`).join('')}</select></div><div class="field"><label>수량</label><input type="number" min="0.1" step="0.1" value="${h(l.qty)}" oninput="setLine(${i},'qty',this.value*1)"></div><div class="field"><label>실제 단가(원)</label><input type="number" min="0" step="100" value="${h(l.price)}" oninput="setLine(${i},'price',this.value*1)"></div><div class="deletecol">${button('× 삭제',`deleteLine(${i})`,'sm danger')}</div></div></div>`).join('')}<div class="actions">${button('+ 시술 항목 추가','addLine()')} ${button('시술 메뉴 관리',"setTab('services')",'sm')}</div>${usageSection()}<h3>현장 추가 비용 및 할인</h3><div class="fields"><div class="field"><label>고객 할인액(원)</label><input type="number" min="0" value="${h(draft.discount)}" oninput="setD('discount',this.value*1)"></div><div class="field"><label>현장 추가 청구금액(원)</label><input type="number" min="0" value="${h(draft.extraCharge)}" oninput="setD('extraCharge',this.value*1)"></div><div class="field"><label>그 밖의 수기 추가 재료원가(원) · 중복주의</label><input type="number" min="0" value="${h(draft.extraMaterial)}" oninput="setD('extraMaterial',this.value*1)"></div><div class="field"><label>시술 메모 (선택)</label><input type="text" maxlength="200" value="${h(draft.memo)}" placeholder="예: 특정 파츠 추가" oninput="setD('memo',this.value)"></div></div><div class="actions">${button(editing?'수정 내역 저장':'시술 1건 저장','saveVisit()','primary')} ${editing?button('수정 취소','cancelEdit()'):button('입력 초기화','resetDraft()')}</div><p class="hint">시술 기록은 저장 시점의 가격·재료원가·정산율로 확정됩니다. 나중에 메뉴나 재료 가격을 수정해도 이전 기록의 금액은 바뀌지 않습니다.</p></section><section class="panel"><h2>이 고객 예상 정산</h2><div id="receipt">${receipt(p)}</div><div class="warn" style="margin-top:14px">이 계산은 <b>이 고객의 시술 원가, 인센티브, 예약금과 잔여금의 수수료</b>를 보여줍니다. 매장 고정비와 아티스트 월 최소 보장액은 월 대시보드에서 합산합니다. 카드 수수료율·급여 공제 설정은 매장 설정에서 수정하세요.</div><div class="actions">${button('월 손익 확인',"setTab('dashboard')")}</div></section></div>`}
function receipt(p){return `<div class="receipt"><div><span>총 시술매출 (1회만 집계)</span><strong>${krw(p.sale)}</strong></div><div><span>① N페이 예약금</span><strong>${krw(p.deposit)}</strong></div><div><span>② 잔여금 · ${h(paymentLabel(p.balancePayment))}</span><strong>${krw(p.balance)}</strong></div>${p.depositTooHigh?`<div style="color:#b13d3d;font-weight:800"><span>예약금이 총 결제금액을 초과합니다</span><span>${krw(p.deposit-p.sale)} 초과</span></div>`:''}<div><span>메뉴 기본 재료원가</span><strong>− ${krw(p.recipeMaterial)}</strong></div><div><span>직접 선택한 사용 재료원가</span><strong>− ${krw(p.useMaterial)}</strong></div><div><span>그 밖의 수기 재료원가</span><strong>− ${krw(p.manualMaterial)}</strong></div><div><span>재료원가 합계</span><strong>− ${krw(p.material)}</strong></div><div><span>아티스트 시술별 정산액</span><strong>− ${krw(p.payroll)}</strong></div><div><span>N페이 예약금 수수료</span><strong>− ${krw(p.depositFee)}</strong></div><div><span>잔여금 ${h(paymentLabel(p.balancePayment))} 수수료</span><strong>− ${krw(p.balanceFee)}</strong></div><div><span>결제 수수료 합계</span><strong>− ${krw(p.processing)}</strong></div><div><span>예상 시술 시간</span><strong>${fmt(p.mins)}분</strong></div><div class="total"><span>1건 기여이익 (고정비·VAT 차감 전)</span><span>${krw(p.contribution)}</span></div></div>`}
function paymentLabel(code){return ({naver:'N페이',card:'카드',cash:'현금',transfer:'계좌이체'})[code]||'미지정'}
function refreshPreview(){let el=document.getElementById('receipt');if(el&&draft)el.innerHTML=receipt(calcDraft(draft))}
function saveVisit(){ensureDraft();if(!cleanDate(draft.date)){alert('시술 날짜를 확인하세요.');return}if(!state.services.length){alert('먼저 시술 메뉴를 등록해 주세요.');return}if(!draft.lines.length||draft.lines.some(l=>!state.services.some(s=>String(s.id)===String(l.serviceId))||num(l.qty)<=0)){alert('시술 메뉴와 수량을 확인하세요.');return}if((draft.usage||[]).some(u=>!state.materials.some(m=>String(m.id)===String(u.id))||num(u.qty)<=0)){alert('사용 재료를 확인하세요. 삭제된 재료가 있거나 사용 수량이 0입니다.');return}let p=calcDraft(draft);if(draft.depositDate&&!cleanDate(draft.depositDate)){alert('예약금 수납일을 확인해 주세요.');return}if(p.depositTooHigh){alert('N페이 예약금이 총 시술금액보다 큽니다. 예약금을 수정하거나 0원으로 설정해 주세요.');return}if(p.sale<=0&&!confirm('결제금액이 0원입니다. 무료 시술로 저장할까요?'))return;if(num(draft.discount)>p.items.reduce((a,x)=>a+x.gross,0)+num(draft.extraCharge)){alert('할인액이 시술금액보다 큽니다.');return}let obj={id:editing||uid(),date:draft.date,customer:draft.customer,memo:draft.memo,entry:clone(draft),...p,createdAt:new Date().toISOString()};if(editing){state.visits=state.visits.map(x=>x.id===editing?obj:x)}else state.visits.push(obj);month=monthOf(obj.date);store();editing=null;draft=null;tab='dashboard';render();window.scrollTo({top:0,behavior:'smooth'})}
function resetDraft(){if(!confirm('현재 입력 내용을 초기화할까요?'))return;editing=null;draft=null;render()}
function cancelEdit(){editing=null;draft=null;render()}
function editVisit(id){let v=state.visits.find(x=>x.id===id);if(!v)return;editing=id;draft=clone(v.entry);if(draft.depositAmount===undefined){draft.depositAmount=0;draft.balancePayment=draft.payment||v.payment||'card';draft.depositDate=''}tab='entry';render();window.scrollTo({top:0,behavior:'smooth'})}
function deleteVisit(id){if(!confirm('이 시술 기록을 삭제할까요? 삭제 즉시 해당 월 손익도 변경됩니다.'))return;state.visits=state.visits.filter(x=>x.id!==id);store();render()}
function viewData(){let visits=state.visits.filter(v=>monthOf(v.date)===month),expenses=state.expenses.filter(v=>monthOf(v.date)===month);let sale=visits.reduce((a,x)=>a+num(x.sale),0)+num(state.settings.otherSales);let material=visits.reduce((a,x)=>a+num(x.material),0),fee=visits.reduce((a,x)=>a+num(x.processing),0),fixed=state.fixed.reduce((a,x)=>a+num(x.amount),0);let extras=expenses.reduce((a,x)=>a+num(x.amount),0)+num(state.settings.monthlyOtherVariable),staffExpense=state.staff.map(s=>{let from=visits.filter(x=>String(x.staffId)===String(s.id));let accrued=from.reduce((a,x)=>a+num(x.payroll),0);let guarantee=from.length?num(s.guarantee):0;return {name:s.name,id:s.id,visits:from.length,accrued,guarantee,payroll:Math.max(accrued,guarantee),added:Math.max(0,guarantee-accrued)}});let payroll=staffExpense.reduce((a,x)=>a+x.payroll,0)+num(state.settings.monthlyExtraPayroll);let beforeVat=sale-material-fee-fixed-extras-payroll;let taxConf=state.taxByMonth[month]||{};let inputVat=num(taxConf.inputVat??0),simplePurchases=num(taxConf.simplifiedPurchaseGross??0),simpleCredits=num(taxConf.simplifiedOtherCredits??0),adjust=signed(taxConf.extraVatAdjust??0);let outputVat=sale/11;let simpleVat=sale*num(state.settings.industryRate)/100*.1;let vat=state.settings.taxType==='general'?outputVat-inputVat+adjust:Math.max(0,simpleVat-simplePurchases*.005-simpleCredits+adjust);let annual=num(state.settings.annualSupply);let exempt=state.settings.taxType==='simplified'&&annual>0&&annual<48000000;if(exempt)vat=0;let afterVat=beforeVat-vat;let paymentAmounts={naverDeposit:0,naverBalance:0,card:0,cash:0,transfer:0,naverDepositFee:0,naverBalanceFee:0,cardFee:0,total:0};for(const v of visits){let d=num(v.deposit??0),b=num(v.balance??v.sale),m=v.balancePayment||v.payment||'card';paymentAmounts.naverDeposit+=d;paymentAmounts.naverDepositFee+=num(v.depositFee??0);if(m==='naver'){paymentAmounts.naverBalance+=b;paymentAmounts.naverBalanceFee+=num(v.balanceFee??v.processing)}else if(m==='card'){paymentAmounts.card+=b;paymentAmounts.cardFee+=num(v.balanceFee??v.processing)}else if(m==='cash')paymentAmounts.cash+=b;else if(m==='transfer')paymentAmounts.transfer+=b;paymentAmounts.total+=num(v.sale)}return {visits,expenses,sale,material,fee,fixed,extras,staffExpense,payroll,beforeVat,inputVat,outputVat,simpleVat,vat,exempt,annual,afterVat,paymentAmounts,visitCount:visits.length,serviceCount:visits.reduce((a,x)=>a+x.items.reduce((b,i)=>b+i.qty,0),0)}}
function paymentOverview(r){let p=r.paymentAmounts;return `<section class="panel"><h2>월 결제수단별 매출 구성</h2><p class="subtitle">예약금과 잔여금을 나눠 보여주지만, <b>총 시술매출에 예약금을 다시 더하지 않습니다.</b> 월 손익은 시술일 기준이며 실제 입금일별 현금흐름과 다를 수 있습니다.</p><div class="scroll"><table><tr><th>결제 구분</th><th>결제금액</th><th>수수료</th></tr><tr><td>N페이 예약금</td><td>${krw(p.naverDeposit)}</td><td>${krw(p.naverDepositFee)}</td></tr><tr><td>N페이 잔여금</td><td>${krw(p.naverBalance)}</td><td>${krw(p.naverBalanceFee)}</td></tr><tr><td>카드 잔여금</td><td>${krw(p.card)}</td><td>${krw(p.cardFee)}</td></tr><tr><td>현금 잔여금</td><td>${krw(p.cash)}</td><td>0원</td></tr><tr><td>계좌이체 잔여금</td><td>${krw(p.transfer)}</td><td>0원</td></tr><tr><td><b>합계 (시술 기록 기준)</b></td><td><b>${krw(p.total)}</b></td><td><b>${krw(r.fee)}</b></td></tr></table></div></section>`}
function dashboard(){let r=viewData();let cards=[['실제 기록 매출',r.sale],['시술한 고객 수',r.visitCount,'명'],['시술 사용 재료원가',r.material],['아티스트 정산·추가 인건비',r.payroll],['고정비',r.fixed],['추가 지출·변동비',r.extras],['카드·플랫폼 수수료',r.fee],['부가세 월별 추정액',r.vat]];return `<section class="panel"><div class="row between"><div><h2>${h(month)} 실시간 매장 손익</h2><p class="subtitle">고객 기록 ${r.visitCount}건 기준 · 입력한 월 고정비는 고객이 없어도 비용으로 반영됩니다.</p></div><div class="actions">${button('+ 고객 시술 기록',"setTab('entry')",'primary')} ${button('+ 지출 기록',"setTab('expenses')")}</div></div><div class="summary">${cards.map(([label,v,unit])=>`<div class="metric"><div class="k">${label}</div><div class="v">${unit?fmt(v)+unit:krw(v)}</div></div>`).join('')}<div class="metric strong"><div class="k">VAT 반영 전 예상 손익</div><div class="v">${krw(r.beforeVat)}</div><div class="sub">매출−재료−급여−고정비−수수료−지출</div></div><div class="metric ${r.afterVat<0?'negative':'strong'}"><div class="k">VAT 차감 후 추정 잔여액</div><div class="v">${krw(r.afterVat)}</div><div class="sub">종합소득세 차감 전 · 현금잔고 아님</div></div></div><div class="warn" style="margin-top:14px">정확도 안내: 재료원가는 <b>사용량 기준</b>이며 실제 이번 달 구매대금과 다릅니다. 부가세 계산에는 실제 과세기간 매입 증빙을 별도로 입력해야 합니다. 이 화면의 VAT 차감 후 잔여액은 참고용이며 실제 순현금흐름이나 확정 세무상 순이익이 아닙니다.</div></section>${paymentOverview(r)}<div class="flex2"><section class="panel"><h2>아티스트별 월 정산 합계</h2><div class="scroll"><table><tr><th>담당자</th><th>고객 수</th><th>시술별 정산</th><th>월 보장 보전</th><th>월 총정산액</th></tr>${r.staffExpense.map(x=>`<tr><td>${h(x.name)}</td><td>${x.visits}</td><td>${krw(x.accrued)}</td><td>${krw(x.added)}</td><td><b>${krw(x.payroll)}</b></td></tr>`).join('')}</table></div><p class="hint">최소 보장은 해당 월에 시술 기록이 있는 담당자에게만 적용합니다. 3.3% 원천징수는 지급 공제액이지 샵의 추가 비용이 아니므로 위 비용에서 다시 차감하지 않습니다.</p></section><section class="panel"><h2>월 손익 산식</h2><div class="receipt"><div><span>고객 실결제 매출</span><b>${krw(r.sale)}</b></div><div><span>재료 원가</span><span>− ${krw(r.material)}</span></div><div><span>인건비(최소 보장 포함)</span><span>− ${krw(r.payroll)}</span></div><div><span>고정비</span><span>− ${krw(r.fixed)}</span></div><div><span>추가 지출</span><span>− ${krw(r.extras)}</span></div><div><span>결제 수수료</span><span>− ${krw(r.fee)}</span></div><div class="total"><span>VAT 전 손익</span><span>${krw(r.beforeVat)}</span></div><div><span>추정 납부 부가세</span><span>− ${krw(r.vat)}</span></div><div class="total"><span>VAT 후 참고 잔여액</span><span>${krw(r.afterVat)}</span></div></div></section></div><section class="panel"><div class="row between"><h2>이번 달 시술 기록</h2><span class="badge">${r.visitCount}건</span></div>${visitsTable(r.visits)}</section>`}
function visitsTable(arr){if(!arr.length)return `<div class="empty">선택한 달의 시술 기록이 없습니다.<br><br>${button('첫 시술 기록하기',"setTab('entry')",'primary')}</div>`;return `<div class="scroll"><table class="minitable"><tr><th>날짜</th><th>담당자</th><th>고객 메모</th><th>시술내용</th><th>사용 재료</th><th>총 시술매출</th><th>예약금 / 잔여금</th><th>재료원가</th><th>인센티브</th><th>1건 기여이익</th><th>관리</th></tr>${[...arr].sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<tr><td>${h(v.date)}</td><td>${h(state.staff.find(a=>String(a.id)===String(v.staffId))?.name||v.artistName||'미지정')}</td><td>${h(v.customer||'-')}</td><td>${v.items.map(i=>h(i.name)+(i.qty!==1?' ×'+i.qty:'')).join(', ')}</td><td>${(v.usageItems||[]).length?(v.usageItems||[]).map(u=>`<span class="tag">${h(u.name)} ×${u.qty}${h(u.unit||'')}</span>`).join(''):'-'}</td><td><b>${krw(v.sale)}</b></td><td><span class="tag">N페이 예약금 ${krw(v.deposit??0)}</span><span class="tag">${h(paymentLabel(v.balancePayment||v.payment||'card'))} ${krw(v.balance??v.sale)}</span></td><td>${krw(v.material)}</td><td>${krw(v.payroll)}</td><td>${krw(v.contribution)}</td><td>${button('수정',`editVisit('${v.id}')`,'sm')} ${button('삭제',`deleteVisit('${v.id}')`,'sm danger')}</td></tr>`).join('')}</table></div>`}
function ledger(){let r=viewData();return `<section class="panel"><h2>${h(month)} 시술 장부</h2><p class="subtitle">고객 1명당 1건 저장합니다. 한 고객이 두 가지 시술을 받았다면 새 고객 기록에서 시술 항목을 2개 추가하세요.</p><div class="actions">${button('+ 시술 기록 추가',"setTab('entry')",'primary')} ${button('시술 장부 CSV 내보내기','exportCsv()')}</div>${visitsTable(r.visits)}</section>`}
function materials(){const counts=Object.fromEntries(Object.keys(MAT_TREE).map(a=>[a,state.materials.filter(m=>m.major===a).length]));let indexed=state.materials.map((m,i)=>({m,i})).filter(({m})=>m.major===matMajor&&(matMajor==='소모품'||m.minor===matMinor));return `<section class="panel"><div class="row between"><div><h2>재료별 원가 · 폴더 관리</h2><p class="subtitle">젤류는 1병당 시술 가능한 인원, 아트 파츠는 1팩의 개수/알 수까지 입력해 단가를 계산합니다. 시술 입력의 [사용 재료]에서 모든 등록 재료를 검색할 수 있습니다.</p></div><span class="pill">전체 ${state.materials.length}종</span></div><div class="folder-majors">${Object.keys(MAT_TREE).map(a=>`<button class="folder-big ${matMajor===a?'selected':''}" onclick="changeMaterialFolderMajor('${a}')">📁 ${h(a)} <span>${counts[a]||0}</span></button>`).join('')}</div>${matMajor!=='소모품'?`<div class="folder-minors">${MAT_TREE[matMajor].map(a=>`<button class="folder-small ${matMinor===a?'selected':''}" onclick="changeMaterialFolderMinor('${a}')">${h(a)} <span>${state.materials.filter(m=>m.major===matMajor&&m.minor===a).length}</span></button>`).join('')}</div>`:''}<div class="row between" style="margin:16px 0 8px"><h3 style="margin:0">${h(matMajor)}${matMajor==='소모품'?'':' / '+h(matMinor)}</h3><span class="pill">${indexed.length}종</span></div><div class="fields" style="margin-bottom:12px"><div class="field"><label>현재 폴더에서 재료명 검색</label><input type="search" value="${h(materialSearch)}" placeholder="재료명 또는 제품번호" oninput="searchMaterialRows(this.value)"></div></div><div class="scroll"><table class="minitable"><tr><th>재료명 / 제품번호</th><th>구입금액(원)</th><th>원가 계산 방식</th><th>고객 수 또는 총 개수</th><th>1회/1개 원가</th><th>관리</th></tr>${indexed.map(({m,i})=>`<tr data-material-row data-search="${h(m.name.toLowerCase())}" style="${materialSearch&&!m.name.toLowerCase().includes(materialSearch.toLowerCase())?'display:none':''}"><td>${cell('materials',i,'name','text')}</td><td>${cell('materials',i,'price')}</td><td><select onchange="changeMaterialMode('${m.id}',this.value)"><option value="customer" ${m.mode!=='each'?'selected':''}>1병당 사용 고객 수</option><option value="each" ${m.mode==='each'?'selected':''}>1팩당 개수/알 수</option></select></td><td>${cell('materials',i,m.mode==='each'?'packQty':'clients')}</td><td><b>${krw(unitMat(m))}</b><br><span class="smnote">/ 1${h(unitLabel(m))}</span></td><td>${button('삭제',`removeItem('materials','${m.id}')`,'sm danger')}</td></tr>`).join('')}</table>${indexed.length?'':'<p class="empty">이 폴더에 등록된 재료가 없습니다.</p>'}</div><div class="new-mat-box"><div class="row between"><h3 style="margin:0">+ 이 폴더에 재료 등록</h3><span class="pill">${h(matMajor)}${matMajor==='소모품'?'':' / '+h(matMinor)}</span></div><div class="fields" style="margin-top:12px"><div class="field"><label>재료명·색상번호</label><input id="newMaterialName" placeholder="예: 드노아 DG01"></div><div class="field"><label>1병/1팩 구입금액(원)</label><input id="newMaterialPrice" type="number" min="0" step="any" placeholder="예: 15000"></div><div class="field"><label>원가 계산 방식</label><select id="newMaterialMode" onchange="showMaterialDivisor()"><option value="customer" ${matMajor==='젤류'?'selected':''}>1병/1통당 사용 고객 수</option><option value="each" ${matMajor!=='젤류'?'selected':''}>1팩에 들어 있는 개수/알 수</option></select></div><div class="field"><label id="newMaterialDivisorLabel">${matMajor==='젤류'?'1병/1통으로 시술 가능한 고객 수':'한 팩에 들어있는 총 개수/알 수'}</label><input id="newMaterialDivisor" type="number" min="0.01" step="any" placeholder="예: 100"></div></div><div class="actions">${button('+ 재료 등록','addMaterialRecord()','primary')}</div></div><p class="warn">구입금액 ÷ 고객 수(또는 총 개수) = 사용 단가. 등록한 재료를 시술 기록에서 ×3 입력하면 3회/3개 원가를 계산합니다. 메뉴의 기본 레시피에 같은 재료가 이미 들어 있다면 고객별 [사용 재료]에 중복 등록하지 마세요. VAT 매입 증빙은 세금 메뉴에서 별도 입력합니다.</p></section>`}
function services(){return `<section class="panel"><h2>시술 메뉴 · 기본 재료 레시피</h2><p class="subtitle">메뉴마다 공통적으로 쓰는 베이스·탑젤·소모품 등을 기본 레시피로 설정하세요. 고객마다 달라지는 컬러·파츠·진주는 [고객 시술 입력 → 사용 재료]에서 선택하는 방식이 중복 계산을 줄입니다.</p><div class="scroll"><table class="minitable"><tr><th>메뉴명</th><th>기본 시술가</th><th>시술 시간(분)</th><th>기타 기본재료 원가(수기)</th><th>1회 기본 재료원가</th><th>관리</th></tr>${state.services.map((s,i)=>`<tr><td>${cell('services',i,'name','text')}</td><td>${cell('services',i,'price')}</td><td>${cell('services',i,'mins')}</td><td>${cell('services',i,'extra')}</td><td><b>${krw(recipeCost(s))}</b></td><td>${button('삭제',`removeItem('services','${s.id}')`,'sm danger')}</td></tr>`).join('')}</table></div>${state.services.map((s,i)=>{let common=state.materials.filter(m=>m.major==='젤류'&&['베이스젤','클리어젤','탑젤'].includes(m.minor)||m.major==='소모품');let chosen=state.materials.filter(m=>(s.materials||[]).some(r=>String(r.id)===String(m.id)));let options=[...new Map([...common,...chosen].map(m=>[String(m.id),m])).values()];return `<div class="recipe"><div class="row between"><b>${h(s.name)} · 기본 재료 선택</b><span class="pill">기본 원가 ${krw(recipeCost(s))}</span></div><div class="checks" style="margin-top:9px">${options.map(m=>{let r=(s.materials||[]).find(x=>String(x.id)===String(m.id));return `<label><input type="checkbox" ${r?'checked':''} onchange="recipeToggle('${s.id}','${m.id}',this.checked)"> ${h(m.name)} <span class="smnote">(${h(matPath(m))})</span></label>${r?`<label style="margin-right:10px">× <input aria-label="${h(m.name)} 사용 배수" style="width:55px;border:1px solid #d2dfd5;border-radius:6px;padding:4px" type="number" step="0.1" min="0" value="${h(r.units)}" onchange="recipeUnits('${s.id}','${m.id}',this.value*1)"></label>`:''}`}).join('')}</div></div>`}).join('')}<div class="actions">${button('+ 시술 메뉴 추가',"newItem('services',{name:'새 시술',price:0,mins:60,materials:[],extra:0})",'primary')}</div><p class="hint">예: 베이스젤과 탑젤을 모든 고객에게 사용한다면 여기서 체크하세요. 실제 선택한 컬러젤·스톤·진주는 고객별 추가 재료에서 선택하면 됩니다. V3에서 가져온 메뉴는 기존 레시피를 유지하므로, 중복된 컬러젤이 없는지 처음 한 번 점검하세요.</p></section>`}
function recipeToggle(sid,mid,on){let s=state.services.find(x=>String(x.id)===String(sid));if(!s)return;s.materials=on?[...s.materials.filter(x=>String(x.id)!==String(mid)),{id:mid,units:1}]:s.materials.filter(x=>String(x.id)!==String(mid));store();render()}
function recipeUnits(sid,mid,v){let s=state.services.find(x=>String(x.id)===String(sid));let r=s?.materials.find(x=>String(x.id)===String(mid));if(r)r.units=num(v);store();render()}
function staff(){return `<section class="panel"><h2>담당 아티스트·정산 기준</h2><p class="subtitle">아티스트를 선택해 시술 기록을 저장하면 해당 직원의 정산액과 월 보장금액을 자동 반영합니다. 3.3%는 프리랜서 세전 정산액에서 지급 시 원천징수하는 금액입니다.</p><div class="scroll"><table class="minitable"><tr><th>담당자</th><th>매출 대비 정산율(%)</th><th>정산액 공제율(%)</th><th>공제 기준</th><th>정산 기준 매출</th><th>최소 보장액(월/원)</th><th>원천징수율(%)</th><th>관리</th></tr>${state.staff.map((s,i)=>`<tr><td>${cell('staff',i,'name','text')}</td><td>${cell('staff',i,'rate')}</td><td>${cell('staff',i,'deduct')}</td><td><select onchange="mutate('staff',${i},'deductOn',this.value)"><option value="commission" ${s.deductOn==='commission'?'selected':''}>인센티브 금액</option><option value="sales" ${s.deductOn==='sales'?'selected':''}>정산기준 매출</option></select></td><td><select onchange="mutate('staff',${i},'base',this.value)"><option value="gross" ${s.base!=='net'?'selected':''}>VAT 포함</option><option value="net" ${s.base==='net'?'selected':''}>VAT 제외</option></select></td><td>${cell('staff',i,'guarantee')}</td><td>${cell('staff',i,'withhold')}</td><td>${button('삭제',`removeItem('staff','${s.id}')`,'sm danger')}</td></tr>`).join('')}</table></div><div class="actions">${button('+ 담당자 추가',"newItem('staff',{name:'새 아티스트',rate:50,deduct:3.5,deductOn:'commission',base:'gross',guarantee:0,withhold:3.3})",'primary')}</div><p class="warn">정산율·공제율·최저보장액은 실제 계약 조건에 맞춰 입력하세요. 예: 매출 50% 정산 후 그 인센티브에서 3.5% 공제하는 경우에는 정산율 50, 공제율 3.5, 공제 기준 '인센티브 금액'을 선택합니다. 공제를 매출 기준으로 하는 계약이라면 '정산기준 매출'을 선택하세요. VAT 제외 정산은 계약에 명시된 경우에만 적용하세요.</p></section><section class="panel"><h2>결제 수수료·월 기타 인건비</h2><div class="fields">${field('카드 수수료(%, 실제 계약 기준)','settings.cardRate')}${field('네이버페이 등 플랫폼 수수료(%)','settings.naverRate')}${field('N페이 예약금 기본값(원)','settings.depositDefault')}${field('그 밖의 월 인건비 합계(원)','settings.monthlyExtraPayroll')}${field('기타 월 공통 변동비(원)','settings.monthlyOtherVariable')}${field('월 기타 매출(원)','settings.otherSales')}</div><p class="hint">예약금 기본값은 신규 시술 기록에만 자동 입력합니다. 결제 수수료는 N페이 예약금과 잔여금 결제수단을 나눠 계산하여 저장합니다. 수수료율을 변경해도 과거 기록에 소급 적용하지 않습니다.</p></section>`}
function fixed(){return `<section class="panel"><h2>매달 반복되는 비용</h2><p class="subtitle">월세·관리비·인터넷·단말기·광고비·보험료·청소비·세무기장료 등을 입력하세요. 매월 자동으로 해당 달 손익에서 차감됩니다.</p><div class="scroll"><table><tr><th>항목</th><th>월 지출액(원)</th><th>관리</th></tr>${state.fixed.map((s,i)=>`<tr><td>${cell('fixed',i,'name','text')}</td><td>${cell('fixed',i,'amount')}</td><td>${button('삭제',`removeItem('fixed','${s.id}')`,'sm danger')}</td></tr>`).join('')}</table></div><div class="actions">${button('+ 월 고정비 추가',"newItem('fixed',{name:'새 비용',amount:0})",'primary')}</div><div class="warn">고정비는 설정을 바꾸면 조회하는 과거 월에도 수정된 금액이 적용됩니다. 임대료 변경 등 과거 월 기록을 고정해야 한다면 매달 비용 기록 또는 별도 월별 고정비 관리가 필요합니다.</div></section>`}
function expenses(){let r=viewData();return `<section class="panel"><h2>일회성·비정기 지출 기록</h2><p class="subtitle">재료 긴급 구매, 장비 수리, 촬영비 등 월 고정비 외 별도 지출이 있을 때 기록하세요. 이미 시술 재료의 '사용원가'에 들어간 재료를 다시 지출로 처리하면 중복 차감됩니다.</p><div class="fields"><div class="field"><label>지출 날짜</label><input id="expenseDate" type="date" value="${h(today())}"></div><div class="field"><label>지출 항목</label><input id="expenseName" placeholder="예: 갑작스러운 수리비"></div><div class="field"><label>금액(원)</label><input id="expenseAmount" type="number" min="1" placeholder="0"></div></div><div class="actions">${button('+ 지출 저장','saveExpense()','primary')}</div><h3>${h(month)} 추가 지출 · ${krw(r.expenses.reduce((a,x)=>a+x.amount,0))}</h3>${r.expenses.length?`<div class="scroll"><table><tr><th>날짜</th><th>항목</th><th>금액</th><th>관리</th></tr>${r.expenses.map(x=>`<tr><td>${h(x.date)}</td><td>${h(x.name)}</td><td>${krw(x.amount)}</td><td>${button('삭제',`deleteExpense('${x.id}')`,'sm danger')}</td></tr>`).join('')}</table></div>`:'<div class="empty">이 달에 별도 기록한 지출이 없습니다.</div>'}</section>`}
function saveExpense(){let date=document.getElementById('expenseDate').value,name=document.getElementById('expenseName').value.trim(),amount=num(document.getElementById('expenseAmount').value);if(!cleanDate(date)||!name||!amount){alert('날짜, 항목, 금액을 확인해 주세요.');return}state.expenses.push({id:uid(),date,name,amount});month=monthOf(date);store();render()}
function deleteExpense(id){if(!confirm('지출 내역을 삭제할까요?'))return;state.expenses=state.expenses.filter(x=>x.id!==id);store();render()}
function updateMonthTax(k,v){state.taxByMonth[month]??={};state.taxByMonth[month][k]=signed(v);store();render()}
function taxInput(label,k){let x=state.taxByMonth[month]?.[k]??0;return `<div class="field"><label>${h(label)}</label><input type="number" step="any" value="${h(x)}" onchange="updateMonthTax('${k}',this.value*1)"></div>`}
function taxes(){let r=viewData();return `<section class="panel"><h2>부가세 추정 · ${h(month)}</h2><div class="fields">${field('과세자 유형','settings.taxType',{options:[['general','일반과세자'],['simplified','간이과세자']]})}${field('간이과세 업종별 부가가치율(%)','settings.industryRate')}${field('간이과세 납부면제 판정용 연간 공급대가(원)','settings.annualSupply')}</div><p class="warn">네일샵 등 '그 밖의 서비스업'의 간이과세 부가가치율은 일반적으로 30%지만 업종분류를 확인해야 합니다. 간이과세 납부면제는 해당 과세기간 공급대가 4,800만 원 미만인 경우 등을 대상으로 하며, 신규·휴폐업 사업자는 연환산 등 별도 요건이 적용됩니다. 위 '연간 공급대가'를 <b>0으로 두면 납부면제를 자동 적용하지 않습니다.</b></p><h3>이 달의 실제 매입 증빙 기준 직접 입력</h3><div class="fields">${taxInput('일반과세 공제 가능한 매입 VAT 합계(원)','inputVat')}${taxInput('간이과세 공제대상 매입 공급대가(원)','simplifiedPurchaseGross')}${taxInput('간이과세 기타 세액공제(원)','simplifiedOtherCredits')}${taxInput('가산세·공제 조정(±원)','extraVatAdjust')}</div><div class="summary" style="margin-top:16px"><div class="metric"><div class="k">월 실매출(공급대가)</div><div class="v">${krw(r.sale)}</div></div><div class="metric"><div class="k">일반과세 매출세액</div><div class="v">${krw(r.outputVat)}</div></div><div class="metric"><div class="k">간이과세 산출세액</div><div class="v">${krw(r.simpleVat)}</div></div><div class="metric strong"><div class="k">선택 유형 기준 월 VAT 추정</div><div class="v">${krw(r.vat)}</div><div class="sub">${r.exempt?'간이과세 납부의무 면제 추정':'과세기간 신고세액 아님'}</div></div></div><p class="hint">모든 시술 실결제금액에 VAT가 포함된 것으로 가정합니다. 일반과세는 매출세액=공급대가÷11, 납부추정=매출세액−증빙 매입세액+조정. 간이과세는 공급대가×업종별 부가가치율×10%−공제대상 매입 공급대가×0.5%−기타 공제+조정으로 추정합니다. 부가세는 실제 신고기간(일반 반기, 간이 연간) 전체를 합쳐 판단해야 합니다. 월별 추정치를 그대로 신고하면 안 됩니다.</p><p class="hint">공식 근거: <a href="https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7696" target="_blank" rel="noreferrer">국세청 업종별 부가가치율</a> · <a href="https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7806" target="_blank" rel="noreferrer">국세청 납부세액 및 간이과세 납부면제 기준</a></p></section><section class="panel"><h2>종합소득세·지방소득세</h2><p class="warn">현재 버전에서 종합소득세는 차감하지 않았습니다. 종합소득세는 한 달 매출만으로 정확히 산출할 수 없고 연간 다른 소득, 필요경비, 소득공제, 세액공제, 기납부세액 등의 자료가 필요합니다. 임의의 세율을 곱해서 '정확한 순이익'으로 표기하지 않습니다.</p></section>`}
function backup(){return `<section class="panel"><h2>데이터 백업·복원</h2><p class="subtitle">현재 버전은 로컬 저장 방식의 웹 프로그램입니다. 설정과 고객 시술 기록은 실행하는 브라우저에 저장되지만 다른 기기·브라우저로 자동 동기화되지는 않습니다.</p><div class="actions">${button('전체 기록 JSON 백업','exportJSON()','primary')} ${button('JSON 백업 불러오기',"document.getElementById('restoreFile').click()")} ${button('시술기록 CSV 다운로드','exportCsv()')} ${button('월 손익 인쇄 / PDF','window.print()')}</div><input type="file" accept=".json,application/json" id="restoreFile" style="display:none" onchange="importJSON(this.files[0])"><div class="warn">백업 없이 브라우저 데이터를 지우거나 다른 기기로 옮기면 자료가 사라질 수 있습니다. 고객의 실제 이름·연락처 등 개인정보는 되도록 기록하지 않고 별도 고객관리 시스템에서 안전하게 관리하세요.</div><h3>데이터 현황</h3><p class="hint">시술 기록 ${state.visits.length}건 · 재료 ${state.materials.length}종 · 시술 메뉴 ${state.services.length}종 · 담당자 ${state.staff.length}명 · 추가 지출 ${state.expenses.length}건</p><div class="actions">${button('모든 데이터 초기화','resetAll()','danger')}</div></section>`}
function dl(text,name,type){let blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){dl(JSON.stringify(state,null,2),'nailshop-v4-backup-'+today()+'.json','application/json')}
function exportCsv(){let head=['날짜','담당자','고객 메모명','시술내용','사용 재료 상세','총 시술매출','N페이 예약금','예약금 수납일','예약금 수수료','잔여금 결제수단','잔여금 결제액','잔여금 수수료','재료 사용원가','담당자 정산액','총 결제수수료','기여이익','메모'];let rows=state.visits.map(x=>[x.date,x.artistName,x.customer||'',x.items.map(i=>i.name+' ×'+i.qty).join(' + '),(x.usageItems||[]).map(u=>u.name+' ×'+u.qty+(u.unit||'')+' ('+Math.round(u.cost)+'원)').join(' / '),x.sale,x.deposit??0,x.depositDate||'',x.depositFee??0,paymentLabel(x.balancePayment||x.payment||'card'),x.balance??x.sale,x.balanceFee??x.processing,x.material,x.payroll,x.processing,x.contribution,x.memo||'']);let enc=x=>'"'+String(x??'').replaceAll('"','""')+'"';dl('\ufeff'+[head,...rows].map(x=>x.map(enc).join(',')).join('\r\n'),'nailshop-visits-v4-'+today()+'.csv','text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;try{let x=JSON.parse(await file.text()),d=(x.version===2||x.version===3||x.version===4)?x:migrate(x);if(!Array.isArray(d.materials)||!Array.isArray(d.services)||!Array.isArray(d.fixed))throw Error('형식이 올바르지 않습니다.');if(!confirm('현재 데이터를 백업 파일의 데이터로 교체합니다. 계속할까요?'))return;state=d;normalize();store();editing=null;draft=null;render();alert('불러오기 완료')}catch(e){alert('불러오기 실패: '+e.message)}}
function resetAll(){if(!confirm('입력한 고객 기록과 설정이 모두 삭제됩니다. 계속할까요?'))return;if(!confirm('삭제 전 JSON 백업을 권장합니다. 정말 초기화할까요?'))return;state=fresh();store();editing=null;draft=null;render()}
const views={entry,dashboard,ledger,materials,services,staff,fixed,expenses,taxes,backup};
function render(){document.getElementById('monthInput').value=month;const tabs=[['entry','+ 고객 시술 입력'],['dashboard','월 손익'],['ledger','시술 장부'],['materials','재료별 원가 · 폴더'],['services','시술 메뉴'],['staff','직원·정산'],['fixed','월 고정비'],['expenses','추가 지출'],['taxes','세금'],['backup','백업']];document.getElementById('nav').innerHTML=tabs.map(([k,v])=>`<button class="${k===tab?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('');document.getElementById('main').innerHTML=(views[tab]||entry)();document.querySelectorAll('#mobileNav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===tab));let more=document.getElementById('moreBtn');if(more)more.classList.toggle('active',!['entry','dashboard','ledger','materials'].includes(tab))}
render();if(initialMsg)setTimeout(()=>alert(initialMsg),100);
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
